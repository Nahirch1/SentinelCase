services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sentinelcase-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "127.0.0.1:1433:1433"

    volumes:
      - sentinelcase-sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost
          -U sa
          -P "$$MSSQL_SA_PASSWORD"
          -C
          -Q "SELECT 1"
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: sentinelcase-api:local
    container_name: sentinelcase-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: >
        Server=sqlserver,1433;
        Database=SentinelCaseDb;
        User Id=sa;
        Password=${MSSQL_SA_PASSWORD};
        TrustServerCertificate=True;
        Encrypt=True;

      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"

    volumes:
      - ${HOME}/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro

    ports:
      - "127.0.0.1:8080:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:8080"

    image: sistema-centinela-frontend:local
    container_name: sistema-centinela-frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:5173:80"

    depends_on:
      api:
        condition: service_started


  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    container_name: sentinelcase-otel-collector
    restart: unless-stopped

    command:
      - "--config=/etc/otelcol-contrib/config.yaml"

    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8889:8889"

    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.73.0
    container_name: sentinelcase-jaeger
    restart: unless-stopped

    environment:
      COLLECTOR_OTLP_ENABLED: "true"

    ports:
      - "127.0.0.1:16686:16686"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: sentinelcase-prometheus
    restart: unless-stopped

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "127.0.0.1:9090:9090"

    depends_on:
      - otel-collector


  grafana:
    image: grafana/grafana:12.1.1
    container_name: sentinelcase-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus


volumes:
  sentinelcase-sqlserver-data:
    name: sentinelcase-sqlserver-data
