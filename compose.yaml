services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sentinelcase-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "127.0.0.1:1433:1433"

    volumes:
      - sentinelcase-sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost
          -U sa
          -P "$$MSSQL_SA_PASSWORD"
          -C
          -Q "SELECT 1"
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  sentinelcase-sqlserver-data:
    name: sentinelcase-sqlserver-data
