services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sentinelcase-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"

    ports:
      - "127.0.0.1:1433:1433"

    volumes:
      - sentinelcase-sqlserver-data:/var/opt/mssql

    healthcheck:
      test:
        - CMD-SHELL
        - >
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost
          -U sa
          -P "$$MSSQL_SA_PASSWORD"
          -C
          -Q "SELECT 1"
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    image: sentinelcase-api:local
    container_name: sentinelcase-api
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__DefaultConnection: >
        Server=sqlserver,1433;
        Database=SentinelCaseDb;
        User Id=sa;
        Password=${MSSQL_SA_PASSWORD};
        TrustServerCertificate=True;
        Encrypt=True;

      OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"

    ports:
      - "127.0.0.1:8080:8080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sentinelcase-sqlserver-data:
    name: sentinelcase-sqlserver-data
