name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore SentinelCase.slnx

      - name: Build
        run: dotnet build SentinelCase.slnx --configuration Release --no-restore

      - name: Run tests
        run: >
          dotnet test SentinelCase.slnx
          --configuration Release
          --no-build
          --verbosity normal

  frontend-build-and-lint:
    name: Frontend build and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint


  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - frontend-build-and-lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build API Docker image
        run: docker build -t sentinelcase-api:ci .

      - name: Build frontend Docker image
        run: >
          docker build
          -f frontend/Dockerfile
          -t sistema-centinela-frontend:ci
          .
