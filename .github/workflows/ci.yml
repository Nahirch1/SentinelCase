name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore SentinelCase.slnx

      - name: Build
        run: dotnet build SentinelCase.slnx --configuration Release --no-restore

      - name: Run tests
        run: >
          dotnet test SentinelCase.slnx
          --configuration Release
          --no-build
          --verbosity normal

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build API Docker image
        run: docker build -t sentinelcase-api:ci .
